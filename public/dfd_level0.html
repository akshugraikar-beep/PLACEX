<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placify – 0-Level DFD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    svg text { font-family: Arial, sans-serif; }
    h2 {
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 2px;
      margin-top: 24px;
      color: #000;
    }
  </style>
</head>
<body>

<svg width="960" height="580" viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg">

  <!-- ======= ENTITY BOXES ======= -->

  <!-- Student -->
  <rect x="30" y="210" width="140" height="70" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="100" y="251" text-anchor="middle" font-size="20" font-weight="bold" fill="black">Student</text>

  <!-- Company / HR -->
  <rect x="30" y="340" width="140" height="70" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="100" y="376" text-anchor="middle" font-size="16" font-weight="bold" fill="black">Company / HR</text>

  <!-- Institution -->
  <rect x="30" y="470" width="140" height="70" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="100" y="511" text-anchor="middle" font-size="17" font-weight="bold" fill="black">Institution</text>

  <!-- Admin -->
  <rect x="790" y="240" width="140" height="70" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="860" y="281" text-anchor="middle" font-size="20" font-weight="bold" fill="black">Admin</text>

  <!-- ======= CENTRAL PROCESS ELLIPSE ======= -->
  <ellipse cx="480" cy="370" rx="175" ry="145" fill="white" stroke="black" stroke-width="3"/>
  <text x="480" y="362" text-anchor="middle" font-size="32" font-weight="bold" fill="black">Placify</text>

  <!-- ======= ARROWS & LABELS: Student <-> Placify ======= -->

  <!-- Student → Placify: Register / Login -->
  <line x1="170" y1="228" x2="306" y2="298" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="255" text-anchor="middle" font-size="11" fill="black">Register / Login</text>

  <!-- Student → Placify: Apply for Jobs -->
  <line x1="170" y1="242" x2="307" y2="316" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="272" text-anchor="middle" font-size="11" fill="black">Apply for Jobs</text>

  <!-- Student → Placify: Practice -->
  <line x1="170" y1="255" x2="308" y2="336" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="290" text-anchor="middle" font-size="11" fill="black">Practice (Coding/Aptitude/Interview)</text>

  <!-- Student → Placify: Submit Resume -->
  <line x1="170" y1="268" x2="308" y2="354" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="308" text-anchor="middle" font-size="11" fill="black">Submit Resume</text>

  <!-- Placify → Student: View Job Listings -->
  <line x1="307" y1="270" x2="170" y2="235" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="248" text-anchor="middle" font-size="11" fill="black">View Job Listings</text>

  <!-- Placify → Student: ATS Resume Score -->
  <line x1="308" y1="254" x2="170" y2="248" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="230" text-anchor="middle" font-size="11" fill="black">ATS Resume Score</text>

  <!-- Placify → Student: Offer Letter -->
  <line x1="308" y1="242" x2="170" y2="258" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="214" text-anchor="middle" font-size="11" fill="black">Offer Letter</text>

  <!-- ======= ARROWS & LABELS: Company/HR <-> Placify ======= -->

  <!-- Company/HR → Placify: Post Jobs -->
  <line x1="170" y1="358" x2="308" y2="388" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="228" y="366" text-anchor="middle" font-size="11" fill="black">Post Jobs</text>

  <!-- Company/HR → Placify: View Applicants -->
  <line x1="170" y1="372" x2="308" y2="403" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="397" text-anchor="middle" font-size="11" fill="black">View Applicants</text>

  <!-- Company/HR → Placify: Schedule Interviews -->
  <line x1="170" y1="385" x2="308" y2="418" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="206" y="415" text-anchor="middle" font-size="11" fill="black">Schedule Interviews</text>

  <!-- Placify → Company/HR: Candidate Profiles -->
  <line x1="308" y1="430" x2="170" y2="392" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="258" y="430" text-anchor="middle" font-size="11" fill="black">Candidate Profiles</text>

  <!-- Placify → Company/HR: AI Analysis Reports -->
  <line x1="308" y1="444" x2="170" y2="405" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="445" text-anchor="middle" font-size="11" fill="black">AI Analysis Reports</text>

  <!-- ======= ARROWS & LABELS: Institution <-> Placify ======= -->

  <!-- Institution → Placify: Register Institution -->
  <line x1="170" y1="488" x2="320" y2="468" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="226" y="470" text-anchor="middle" font-size="11" fill="black">Register Institution</text>

  <!-- Institution → Placify: Monitor Students -->
  <line x1="170" y1="502" x2="320" y2="480" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="216" y="500" text-anchor="middle" font-size="11" fill="black">Monitor Students</text>

  <!-- Placify → Institution: Student Performance Reports -->
  <line x1="320" y1="498" x2="170" y2="515" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="524" text-anchor="middle" font-size="11" fill="black">Student Performance Reports</text>

  <!-- Placify → Institution: Dept Analytics -->
  <line x1="320" y1="510" x2="170" y2="528" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="228" y="546" text-anchor="middle" font-size="11" fill="black">Department Analytics</text>

  <!-- ======= ARROWS & LABELS: Admin <-> Placify ======= -->

  <!-- Admin → Placify: Manage Users -->
  <line x1="790" y1="258" x2="654" y2="302" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="736" y="268" text-anchor="middle" font-size="11" fill="black">Manage Users</text>

  <!-- Admin → Placify: View Feedback -->
  <line x1="790" y1="272" x2="655" y2="318" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="738" y="288" text-anchor="middle" font-size="11" fill="black">View Feedback</text>

  <!-- Admin → Placify: Generate Reports -->
  <line x1="790" y1="286" x2="655" y2="335" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="738" y="310" text-anchor="middle" font-size="11" fill="black">Generate Reports</text>

  <!-- Placify → Admin: System Insights -->
  <line x1="655" y1="288" x2="790" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="724" y="256" text-anchor="middle" font-size="11" fill="black">System Insights</text>

  <!-- Placify → Admin: User Analytics -->
  <line x1="655" y1="274" x2="790" y2="274" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="724" y="244" text-anchor="middle" font-size="11" fill="black">User Analytics</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="black"/>
    </marker>
  </defs>

</svg>

<h2>0-LEVEL DFD</h2>

</body>
</html>
